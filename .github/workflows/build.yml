name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "IslandReplica/**"
      - ".github/workflows/build.yml"
      - "IslandReplica.sln"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows x64 app
        run: dotnet publish IslandReplica/IslandReplica.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandReplica-Windows-x64
          path: publish/IslandReplica.exe
          if-no-files-found: error
